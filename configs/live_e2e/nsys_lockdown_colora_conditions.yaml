# Nsys profiling sweep: one .nsys-rep (or .qdrep) per run under each run's paper_runs/<run_label>/.
# Matches the lockdown / ablation labels from the paper-style dashboard.
#
# The runner wraps the benchmark in nsys with a real shell command (env assignments must not sit
# where nsys expects the executable). Unfolded shape:
#   nsys profile --stats=true --trace=cuda,nvtx --output='<paper_runs>/<nsys_output_prefix>'
#     --force-overwrite=true [--delay=<nsys_delay_seconds>]
#     bash -c 'MOE_COALESCING_PACKER=... COLORA_CPU_KERNEL_MODE=... test/lora/benchmark_lora.sh ...'
#   (No standalone "--" before bash; nsys errors on it as an ambiguous option.)
# Optional per-run YAML: nsys_trace, nsys_force_overwrite, nsys_delay_seconds.
#
# Run:
#   conda activate lightllm-with-deepep   # or env where nsys + gunicorn are available
#   python -m tools.evaluation.live_e2e --manifest configs/live_e2e/nsys_lockdown_colora_conditions.yaml
#
# Artifacts: artifacts/evaluation/live_e2e/<run_id>/paper_runs/<run_label>/
#   - nsys: <nsys_output_prefix>.nsys-rep (or .qdrep, depending on nsys version)
#   - benchmark_stdout.log, per_request_metrics.jsonl, run_result.json

run_id: nsys_lockdown_colora_conditions_01
description: >
  Nsys profile for each lockdown baseline and execution-first ablation condition.
  Each run enables nsys with a stable output prefix equal to run_label.

benchmark_script: test/lora/benchmark_lora.sh

runs:
  - run_label: colora_load_then_run_sync
    suite_kind: paper
    mode_label: load_then_run_sync
    compute_device: "vl_storage:gpu,vl_compute:gpu,attn_storage:gpu,attn_compute:gpu,moe_storage:cpu,moe_compute:gpu"
    miss_handling_mode: load_then_run
    overlap_policy: no_overlap
    async_fallback: false
    cpu_workers: 0
    cpu_queue_depth: 8
    cpu_batch_timeout_us: 500
    cpu_kernel_mode: avx
    coalescing_packer: true
    warmup_requests: 4
    measurement_requests: 32
    nsys_enabled: true
    nsys_output_prefix: colora_load_then_run_sync
    nsys_delay_seconds: 110
    output_root: artifacts/evaluation/live_e2e

  - run_label: colora_load_then_run_skip_reinsert
    suite_kind: paper
    mode_label: load_then_run_skip_reinsert
