# Ablation: execution-first overlap with AVX MoE CPU kernels + coalescing packer off.
run_id: ablation_ExecuteFirst_Avx_CoalescingPackerOff_01
description: >
  Demonstrates cpu_kernel_mode + coalescing_packer wiring for live E2E (AVX + packer off).

benchmark_script: test/lora/benchmark_lora.sh

runs:
  - run_label: colora_exec_first_avx_packer_off
    suite_kind: paper
    mode_label: execution_first_avx_packer_off
    compute_device: "vl_storage:gpu,vl_compute:gpu,attn_storage:gpu,attn_compute:gpu,moe_storage:cpu,moe_compute:hybrid"
    miss_handling_mode: cpu_first
    overlap_policy: request_skip
    async_fallback: true
    cpu_workers: 2
    cpu_queue_depth: 8
    cpu_batch_timeout_us: 500
    cpu_kernel_mode: avx
    coalescing_packer: false
    warmup_requests: 4
    measurement_requests: 32
    nsys_enabled: false
    output_root: artifacts/evaluation/live_e2e
