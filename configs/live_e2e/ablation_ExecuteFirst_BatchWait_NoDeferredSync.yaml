run_id: ablation_ExecuteFirst_BatchWait_NoDeferredSync_01
description: >
  Execution-first ablation under batch-wait/no-overlap, disabling deferred
  synchronization/promotion path. Single-run manifest for no_deferred_sync policy.

benchmark_script: test/lora/benchmark_lora.sh

runs:
  - run_label: colora_execution_first_no_deferred_sync
    suite_kind: paper
    mode_label: execution_first_no_deferred_sync
    compute_device: "vl_storage:gpu,vl_compute:gpu,attn_storage:gpu,attn_compute:gpu,moe_storage:cpu,moe_compute:hybrid"
    miss_handling_mode: no_deferred_sync
    overlap_policy: no_overlap
    async_fallback: false
    cpu_workers: 1
    cpu_queue_depth: 8
    cpu_batch_timeout_us: 500
    cpu_kernel_mode: naive
    coalescing_packer: false
    warmup_requests: 4
    measurement_requests: 32
    nsys_enabled: false
    output_root: artifacts/evaluation/live_e2e
