run_id: baseline_LoadThenRun_SkipReinsert_01
description: >
  Stability gate only (not a paper results baseline): same workload and GPU-centric
  settings as baseline_LoadThenRun_BatchWait, but with request-level skip-and-reinsert
  enabled so continuation batches are exercised under load_then_run.
  Miss policy remains promotion-first: cold expert–LoRA is loaded to GPU, then GPU
  compute—no async CPU LoRA fallback (async_fallback false, cpu_workers 0).
  Use this to verify skip/reinsert before running execution-first / hybrid configs.

benchmark_script: test/lora/benchmark_lora.sh

runs:
  - run_label: colora_load_then_run_skip_reinsert
    suite_kind: paper
    mode_label: load_then_run_skip_reinsert
    compute_device: "vl_storage:gpu,vl_compute:gpu,attn_storage:gpu,attn_compute:gpu,moe_storage:cpu,moe_compute:gpu"
    miss_handling_mode: load_then_run
    # Runner: only "no_overlap" => --colora_request_skip 0; any other value => 1
    overlap_policy: skip_reinsert_stability
    async_fallback: false
    cpu_workers: 0
    cpu_queue_depth: 8
    cpu_batch_timeout_us: 500
    speculative_dispatch: false
    warmup_requests: 4
    measurement_requests: 32
    nsys_enabled: false
    output_root: artifacts/evaluation/live_e2e
