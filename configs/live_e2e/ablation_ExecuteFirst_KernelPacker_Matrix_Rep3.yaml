# Fast 2x2 matrix with 3 repeats for iterative diagnosis.
run_id: ablation_ExecuteFirst_KernelPacker_Matrix_Rep3_01
description: >
  Fixed-condition 2x2 matrix with 3 repeats using a reduced 4-adapter set and
  shorter request counts to keep turnaround practical during debugging.

benchmark_script: test/lora/benchmark_lora.sh

runs:
  - run_label: colora_exec_first_avx_packer_on_r1
    suite_kind: paper
    mode_label: matrix_avx_on
    compute_device: "vl_storage:gpu,vl_compute:gpu,attn_storage:gpu,attn_compute:gpu,moe_storage:cpu,moe_compute:hybrid"
    miss_handling_mode: cpu_first
    overlap_policy: request_skip
    async_fallback: true
    cpu_workers: 2
    cpu_queue_depth: 8
    cpu_batch_timeout_us: 500
    cpu_kernel_mode: avx
    coalescing_packer: true
    warmup_requests: 1
    measurement_requests: 8
    nsys_enabled: false
    output_root: artifacts/evaluation/live_e2e

