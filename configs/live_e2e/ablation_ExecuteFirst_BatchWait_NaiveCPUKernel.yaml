run_id: ablation_ExecuteFirst_BatchWait_NaiveCPUKernel_01
description: >
  Execution-first ablation under batch-wait/no-overlap with synchronous CPU fallback
  and no speculative dispatch. Single-run manifest for cpu_first policy.

benchmark_script: test/lora/benchmark_lora.sh

runs:
  - run_label: colora_execution_first_naive_no_overlap
    suite_kind: paper
    mode_label: execution_first_naive_no_overlap
    compute_device: "vl_storage:gpu,vl_compute:gpu,attn_storage:gpu,attn_compute:gpu,moe_storage:cpu,moe_compute:hybrid"
    miss_handling_mode: cpu_first
    overlap_policy: no_overlap
    async_fallback: false
    cpu_workers: 1
    cpu_queue_depth: 8
    cpu_batch_timeout_us: 500
    speculative_dispatch: false
    warmup_requests: 4
    measurement_requests: 32
    nsys_enabled: false
    output_root: artifacts/evaluation/live_e2e
